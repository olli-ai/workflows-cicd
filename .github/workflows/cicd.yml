on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      appName:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK:
        required: true
      TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  # Cluster configurations
  EKS_CLUSTER_US: buddyos
  EKS_CLUSTER_AP: eks-primary-prod-01  # Use same cluster name or change if different
  REGISTRY_US: 905418372464.dkr.ecr.us-east-1.amazonaws.com
  REGISTRY_AP: 905418372464.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE_NAME: ${{ inputs.imageName }}
  ENV_DEV: dev
  ENV_STG: stg
  ENV_PRE-PROD: uat
  ENV_PROD: prod
  # CD
  RELEASE_NAME: "chart-k8s"
  APP_NAME: ${{ inputs.appName }}
  NAMESPACE_DEV: "service-dev"
  NAMESPACE_STG: "service-staging"
  NAMESPACE_PRE-PROD: "service-uat"
  NAMESPACE_PROD: "service-production"

jobs:
  # STAGING
  build-and-push-staging:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Tag Version
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Docker image
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Building Docker image for staging with tag: $TAG"
          DOCKER_BUILDKIT=0 docker build -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push to US ECR Registry (Staging)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 ecr describe-repositories --repository-names ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }} || aws --region us-east-1 ecr create-repository --repository-name ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_US }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_US }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Push to AP ECR Registry (Staging)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 ecr describe-repositories --repository-names ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }} || aws --region ap-southeast-1 ecr create-repository --repository-name ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_AP }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_AP }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  deploy-us-east-1-staging:
    needs: build-and-push-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for US
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to US-East-1 EKS Cluster (Staging)
        env:
          TAG: ${{ needs.build-and-push-staging.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 eks update-kubeconfig --region us-east-1 --name ${{ env.EKS_CLUSTER_US }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify staging values file exists
          if [ ! -f "values-staging-us.yaml" ]; then
            echo "Error: values-staging-us.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_US }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_STG }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_US }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-staging-us.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=us-east-1 \
            --atomic \
            --timeout 10m0s

  deploy-ap-southeast-1-staging:
    needs: build-and-push-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for AP
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AP-Southeast-1 EKS Cluster (Staging)
        env:
          TAG: ${{ needs.build-and-push-staging.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 eks update-kubeconfig --region ap-southeast-1 --name ${{ env.EKS_CLUSTER_AP }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify staging values file exists
          if [ ! -f "values-staging-ap.yaml" ]; then
            echo "Error: values-staging-ap.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_AP }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_STG }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_AP }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-staging-ap.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=ap-southeast-1 \
            --atomic \
            --timeout 10m0s
          
    


  deployment-summary-staging:
    needs: [deploy-us-east-1-staging, deploy-ap-southeast-1-staging]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - name: Multi-Region Deployment Summary
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: ${{ (needs.deploy-us-east-1-staging.result == 'success' && needs.deploy-ap-southeast-1-staging.result == 'success') && 'good' || (needs.deploy-us-east-1-staging.result == 'failure' || needs.deploy-ap-southeast-1-staging.result == 'failure') && 'danger' || 'warning' }}
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: |
            • US-East-1: ${{ needs.deploy-us-east-1-staging.result == 'success' && 'Success' || needs.deploy-us-east-1-staging.result == 'failure' && 'Failed' || 'Skipped' }}
            • AP-Southeast-1: ${{ needs.deploy-ap-southeast-1-staging.result == 'success' && 'Success' || needs.deploy-ap-southeast-1-staging.result == 'failure' && 'Failed' || 'Skipped' }}
          SLACK_TITLE: 'Multi-Region Deployment Complete Staging - ${{ env.APP_NAME }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # PRODUCTION
  build-and-push-production:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Tag Version
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Docker image
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Building Docker image for production with tag: $TAG"
          DOCKER_BUILDKIT=0 docker build -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push to US ECR Registry (Production)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 ecr describe-repositories --repository-names ${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }} || aws --region us-east-1 ecr create-repository --repository-name ${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_US }}/${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_US }}/${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Push to AP ECR Registry (Production)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 ecr describe-repositories --repository-names ${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }} || aws --region ap-southeast-1 ecr create-repository --repository-name ${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_AP }}/${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_AP }}/${{ env.ENV_PROD }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  deploy-us-east-1-production:
    needs: build-and-push-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for US
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to US-East-1 EKS Cluster (Production)
        env:
          TAG: ${{ needs.build-and-push-production.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 eks update-kubeconfig --region us-east-1 --name ${{ env.EKS_CLUSTER_US }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify production values file exists
          if [ ! -f "values-production-us.yaml" ]; then
            echo "Error: values-production-us.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_US }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_PROD }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_US }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-production-us.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=us-east-1 \
            --atomic \
            --timeout 10m0s

  deploy-ap-southeast-1-production:
    needs: build-and-push-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for AP
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AP-Southeast-1 EKS Cluster (Production)
        env:
          TAG: ${{ needs.build-and-push-production.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 eks update-kubeconfig --region ap-southeast-1 --name ${{ env.EKS_CLUSTER_AP }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify production values file exists
          if [ ! -f "values-production-ap.yaml" ]; then
            echo "Error: values-production-ap.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_AP }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_PROD }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_AP }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-production-ap.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=ap-southeast-1 \
            --atomic \
            --timeout 10m0s

  deployment-summary-production:
    needs: [deploy-us-east-1-production, deploy-ap-southeast-1-production]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/production'
    steps:
      - name: Multi-Region Deployment Summary
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: ${{ (needs.deploy-us-east-1-production.result == 'success' && needs.deploy-ap-southeast-1-production.result == 'success') && 'good' || (needs.deploy-us-east-1-production.result == 'failure' || needs.deploy-ap-southeast-1-production.result == 'failure') && 'danger' || 'warning' }}
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: |
            • US-East-1: ${{ needs.deploy-us-east-1-production.result == 'success' && 'Success' || needs.deploy-us-east-1-production.result == 'failure' && 'Failed' || 'Skipped' }}
            • AP-Southeast-1: ${{ needs.deploy-ap-southeast-1-production.result == 'success' && 'Success' || needs.deploy-ap-southeast-1-production.result == 'failure' && 'Failed' || 'Skipped' }}
          SLACK_TITLE: 'Multi-Region Deployment Complete Production - ${{ env.APP_NAME }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}