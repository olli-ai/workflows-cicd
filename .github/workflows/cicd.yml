on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      appName:
        required: true
        type: string
      gitopsService:
        required: false
        type: string
        default: ''  # logical key in olli-gitops (services/<key>); defaults to appName
      environment:
        required: false
        type: string
        default: 'auto'  # auto, staging, production, uat
      regions:
        required: false
        type: string
        default: 'us-east-1,ap-southeast-1'  # Comma-separated list
      primaryRegion:
        required: false
        type: string
        default: 'us-east-1'
      secondaryRegion:
        required: false
        type: string
        default: 'ap-southeast-1'
      keepImageCount:
        required: false
        type: number
        default: 10
    secrets:
      SLACK_WEBHOOK:
        required: true
      TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      # GitHub App that can push to olli-gitops (mints a short-lived token per run).
      # Store App ID + private key as org Actions secrets.
      GITOPS_APP_ID:
        required: true
      GITOPS_APP_PRIVATE_KEY:
        required: true

env:
  # AWS Account and Registry configurations
  AWS_ACCOUNT_ID: "905418372464"

  # Cluster configurations (region -> EKS cluster; also the olli-gitops placement key)
  EKS_CLUSTER_PRIMARY: buddyos-us-2
  EKS_CLUSTER_SECONDARY: eks-primary-prod-01

  # Registry configurations
  ECR_DOMAIN: dkr.ecr
  ECR_SUFFIX: amazonaws.com

  # Build configurations
  IMAGE_NAME: ${{ inputs.imageName }}
  APP_NAME: ${{ inputs.appName }}
  PRIMARY_REGION: ${{ inputs.primaryRegion }}
  SECONDARY_REGION: ${{ inputs.secondaryRegion }}

  # Environment names (previously hardcoded)
  ENVIRONMENT_DEV: dev
  ENVIRONMENT_DEMO: demo
  ENVIRONMENT_STAGING: staging
  ENVIRONMENT_UAT: uat
  ENVIRONMENT_PRODUCTION: production
  ENVIRONMENT_AUTO: auto

  # Branch mapping (previously hardcoded)
  DEV_BRANCH: dev
  DEMO_BRANCH: demo
  STAGING_BRANCHES: "master,release/*"
  UAT_BRANCH: pre-production
  PRODUCTION_BRANCH: production

  # Platform configuration (previously hardcoded)
  BUILD_PLATFORM: linux/amd64

  # Notification configuration (previously hardcoded)
  SLACK_CHANNEL: alert-services
  SLACK_USERNAME: devops

  # GitOps repository (Argo CD reconciles from here; CI only mirrors into it)
  GITOPS_REPO: olli-ai/olli-gitops
  GITOPS_OWNER: olli-ai
  KEEP_IMAGE_COUNT: ${{ inputs.keepImageCount }}

jobs:
  # Determine deployment strategy
  SETUP:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      regions: ${{ steps.regions.outputs.regions }}
      regions-matrix: ${{ steps.regions.outputs.regions-matrix }}
      environment: ${{ steps.strategy.outputs.environment }}
      environments-matrix: ${{ steps.strategy.outputs.environments-matrix }}
      region-config: ${{ steps.regions.outputs.region-config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Tag Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          bump_each_commit: true
          tag_prefix: "v"

      - name: Determine deployment strategy
        id: strategy
        run: |
          ENVIRONMENTS=()

          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_DEV }}" ]] || [[ "${{ github.ref }}" == "refs/heads/${{ env.DEV_BRANCH }}" && "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_AUTO }}" ]]; then
            ENVIRONMENTS+=("${{ env.ENVIRONMENT_DEV }}")
          fi

          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_DEMO }}" ]] || [[ "${{ github.ref }}" == "refs/heads/${{ env.DEMO_BRANCH }}" && "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_AUTO }}" ]]; then
            ENVIRONMENTS+=("${{ env.ENVIRONMENT_DEMO }}")
          fi

          STAGING_MATCH=false
          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_AUTO }}" ]]; then
            CURRENT_REF="${{ github.ref }}"
            IFS=',' read -ra STAGING_PATTERNS <<< "${{ env.STAGING_BRANCHES }}"
            for pattern in "${STAGING_PATTERNS[@]}"; do
              # Trim whitespace
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
              pattern="${pattern%"${pattern##*[![:space:]]}"}"
              full_pattern="refs/heads/$pattern"
              # Unquoted RHS enables glob matching (e.g. release/*)
              if [[ "$CURRENT_REF" == $full_pattern ]]; then
                STAGING_MATCH=true
                break
              fi
            done
          fi
          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_STAGING }}" ]] || [[ "$STAGING_MATCH" == "true" ]]; then
            ENVIRONMENTS+=("${{ env.ENVIRONMENT_STAGING }}")
          fi

          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_UAT }}" ]] || [[ "${{ github.ref }}" == "refs/heads/${{ env.UAT_BRANCH }}" && "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_AUTO }}" ]]; then
            ENVIRONMENTS+=("${{ env.ENVIRONMENT_UAT }}")
          fi

          if [[ "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_PRODUCTION }}" ]] || [[ "${{ github.ref }}" == "refs/heads/${{ env.PRODUCTION_BRANCH }}" && "${{ inputs.environment }}" == "${{ env.ENVIRONMENT_AUTO }}" ]]; then
            ENVIRONMENTS+=("${{ env.ENVIRONMENT_PRODUCTION }}")
          fi

          # Create JSON array for matrix strategy
          if [ ${#ENVIRONMENTS[@]} -gt 0 ]; then
            ENVIRONMENTS_JSON=$(printf '%s\n' "${ENVIRONMENTS[@]}" | jq -R . | jq -s -c .)
            echo "environments-matrix=${ENVIRONMENTS_JSON}" >> $GITHUB_OUTPUT
            echo "environment=${ENVIRONMENTS[0]}" >> $GITHUB_OUTPUT
          else
            echo "environments-matrix=[]" >> $GITHUB_OUTPUT
            echo "environment=none" >> $GITHUB_OUTPUT
          fi

      - name: Parse regions and create configuration
        id: regions
        run: |
          regions="${{ inputs.regions }}"
          environment="${{ steps.strategy.outputs.environment }}"

          echo "regions=${regions}" >> $GITHUB_OUTPUT

          # Convert comma-separated regions to JSON array for matrix
          IFS=',' read -ra REGION_ARRAY <<< "$regions"

          # Filter regions that have corresponding values YAML files
          VALID_REGIONS=()
          for region in "${REGION_ARRAY[@]}"; do
            VALUES_FILE="values-${environment}-${region}.yaml"
            if [[ -f "$VALUES_FILE" ]]; then
              echo "✅ Found $VALUES_FILE"
              VALID_REGIONS+=("$region")
            else
              echo "⚠️ Missing $VALUES_FILE — skipping region $region"
            fi
          done

          REGIONS_JSON=$(printf '%s\n' "${VALID_REGIONS[@]}" | jq -R . | jq -cs .)
          echo "regions-matrix=${REGIONS_JSON}" >> $GITHUB_OUTPUT

          # Create region configuration JSON (region -> ECR registry + EKS cluster).
          # The cluster name doubles as the olli-gitops placement key (<env>-<cluster>).
          cat > region_config.json << EOF
          {
            "${{ env.PRIMARY_REGION }}": {
              "registry": "${{ env.AWS_ACCOUNT_ID }}.${{ env.ECR_DOMAIN }}.${{ env.PRIMARY_REGION }}.${{ env.ECR_SUFFIX }}",
              "cluster": "${{ env.EKS_CLUSTER_PRIMARY }}"
            },
            "${{ env.SECONDARY_REGION }}": {
              "registry": "${{ env.AWS_ACCOUNT_ID }}.${{ env.ECR_DOMAIN }}.${{ env.SECONDARY_REGION }}.${{ env.ECR_SUFFIX }}",
              "cluster": "${{ env.EKS_CLUSTER_SECONDARY }}"
            }
          }
          EOF

          REGION_CONFIG=$(cat region_config.json | jq -c .)
          echo "region-config=${REGION_CONFIG}" >> $GITHUB_OUTPUT

  # Build and push images
  BUILD_AND_PUSH:
    needs: [SETUP]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ${{ fromJson(needs.SETUP.outputs.regions-matrix) }}
        environment: ${{ fromJson(needs.SETUP.outputs.environments-matrix) }}
      fail-fast: false  # Important: Don't fail fast so we can track individual results
    outputs:
      version: ${{ needs.SETUP.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}
          role-duration-seconds: 3600

      - name: Set dynamic environment variables
        run: |
          # Parse region configuration
          REGION_CONFIG='${{ needs.SETUP.outputs.region-config }}'
          REGISTRY=$(echo $REGION_CONFIG | jq -r '.["${{ matrix.region }}"].registry')
          echo "REGISTRY=${REGISTRY}" >> $GITHUB_ENV

          # Set target environment based on deployment type
          if [[ "${{ matrix.environment }}" == "${{ env.ENVIRONMENT_DEV }}" ]]; then
            echo "TARGET_ENV=${{ env.ENVIRONMENT_DEV }}" >> $GITHUB_ENV
          elif [[ "${{ matrix.environment }}" == "${{ env.ENVIRONMENT_DEMO }}" ]]; then
            echo "TARGET_ENV=${{ env.ENVIRONMENT_DEMO }}" >> $GITHUB_ENV
          elif [[ "${{ matrix.environment }}" == "${{ env.ENVIRONMENT_STAGING }}" ]]; then
            echo "TARGET_ENV=${{ env.ENVIRONMENT_STAGING }}" >> $GITHUB_ENV
          elif [[ "${{ matrix.environment }}" == "${{ env.ENVIRONMENT_UAT }}" ]]; then
            echo "TARGET_ENV=${{ env.ENVIRONMENT_UAT }}" >> $GITHUB_ENV
          elif [[ "${{ matrix.environment }}" == "${{ env.ENVIRONMENT_PRODUCTION }}" ]]; then
            echo "TARGET_ENV=${{ env.ENVIRONMENT_PRODUCTION }}" >> $GITHUB_ENV
          fi

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ matrix.region }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}

      - name: Build and push Docker image
        env:
          TAG: ${{ needs.SETUP.outputs.version }}
        run: |
          # Create repository if it doesn't exist
          aws ecr describe-repositories --region ${{ matrix.region }} --repository-names ${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }} || \
          aws ecr create-repository --region ${{ matrix.region }} --repository-name ${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }}

          # Build and push with cache
          docker buildx build \
            --platform ${{ env.BUILD_PLATFORM }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }}:cache \
            --cache-to type=registry,ref=${{ env.REGISTRY }}/${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }}:cache,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --tag ${{ env.REGISTRY }}/${{ env.TARGET_ENV }}/${{ env.IMAGE_NAME }}:latest \
            --push \
            .

      - name: Report build status to step summary
        if: always()
        run: |
          JOB_ID="${{ matrix.region }}-${{ matrix.environment }}-build"

          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS="Success"
            EXIT_CODE=0
          else
            STATUS="Failed"
            EXIT_CODE=1
          fi

          echo "### Build Status: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ matrix.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID**: ${JOB_ID}" >> $GITHUB_STEP_SUMMARY

          # Create a unique comment that the summary job can parse
          echo "BUILD_RESULT:${JOB_ID}:${STATUS}" >> $GITHUB_STEP_SUMMARY

  # GitOps "deploy": mirror this build's values + tag into olli-gitops.
  # Argo CD reconciles from olli-gitops and rolls out to every cluster the
  # service is placed on — there is no per-cluster helm upgrade here anymore.
  UPDATE_GITOPS:
    needs: [SETUP, BUILD_AND_PUSH]
    runs-on: ubuntu-latest
    # Only mirror once the image(s) for this build are actually in ECR.
    if: needs.BUILD_AND_PUSH.result == 'success'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.SETUP.outputs.environments-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout service repository (authoritative values)
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 0
          submodules: true

      - name: Mint short-lived olli-gitops push token
        id: gitops-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ env.GITOPS_OWNER }}
          repositories: olli-gitops

      - name: Checkout olli-gitops (reconciled mirror)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Mirror values + bump tag
        working-directory: gitops
        env:
          SERVICE: ${{ inputs.gitopsService != '' && inputs.gitopsService || inputs.appName }}
          ENV: ${{ matrix.environment }}
          TAG: ${{ needs.SETUP.outputs.version }}
          REGIONS: ${{ needs.SETUP.outputs.regions }}
          REGION_CONFIG: ${{ needs.SETUP.outputs.region-config }}
        run: |
          # yq (mikefarah v4) ships on the ubuntu-latest runner; bump-tag.sh needs it.
          yq --version

          # Build <env>-<cluster>:values-<env>-<region>.yaml pairs from region-config.
          # The service repo authors values-<env>-<region>.yaml; olli-gitops stores them
          # per placement as services/<service>/values/<env>-<cluster>.yaml.
          PAIRS=()
          IFS=',' read -ra REGION_ARRAY <<< "$REGIONS"
          for region in "${REGION_ARRAY[@]}"; do
            CLUSTER=$(echo "$REGION_CONFIG" | jq -r --arg r "$region" '.[$r].cluster')
            SRC="values-${ENV}-${region}.yaml"
            if [[ -z "$CLUSTER" || "$CLUSTER" == "null" ]]; then
              echo "⚠️ No cluster mapping for region $region — skipping"
              continue
            fi
            if [[ -f "../service/$SRC" ]]; then
              echo "✅ Will mirror $SRC → ${ENV}-${CLUSTER}.yaml"
              PAIRS+=("${ENV}-${CLUSTER}:${SRC}")
            else
              echo "⚠️ Missing ../service/$SRC — skipping region $region"
            fi
          done

          if [ ${#PAIRS[@]} -eq 0 ]; then
            echo "💥 No values files to mirror for env '$ENV'"
            exit 1
          fi

          # Mirror values into olli-gitops, then bump the image tag across placements.
          ./scripts/sync-values.sh "$SERVICE" ../service "${PAIRS[@]}"
          ./scripts/bump-tag.sh "$SERVICE" "$ENV" "$TAG"

      - name: Commit & push to olli-gitops
        working-directory: gitops
        env:
          SERVICE: ${{ inputs.gitopsService != '' && inputs.gitopsService || inputs.appName }}
          ENV: ${{ matrix.environment }}
          TAG: ${{ needs.SETUP.outputs.version }}
        run: |
          git config user.name  "olli-ci"
          git config user.email "ci@olli-ai.com"
          git add -A
          if git commit -m "deploy(${SERVICE}/${ENV}): ${TAG}"; then
            git push
            echo "✅ Pushed ${SERVICE}/${ENV} @ ${TAG} — Argo CD will reconcile"
          else
            echo "ℹ️ No changes to mirror for ${SERVICE}/${ENV}"
          fi

      - name: Report GitOps status to step summary
        if: always()
        run: |
          JOB_ID="${{ matrix.environment }}-gitops"

          if [[ "${{ needs.BUILD_AND_PUSH.result }}" != "success" ]]; then
            STATUS="Skipped (Build Failed)"
          elif [[ "${{ job.status }}" == "success" ]]; then
            STATUS="Success"
          else
            STATUS="Failed"
          fi

          echo "### GitOps Sync Status: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID**: ${JOB_ID}" >> $GITHUB_STEP_SUMMARY

          # Create a unique comment that the summary job can parse
          echo "GITOPS_RESULT:${JOB_ID}:${STATUS}" >> $GITHUB_STEP_SUMMARY

  # Deployment summary
  SUMMARY:
    needs: [ SETUP, BUILD_AND_PUSH, UPDATE_GITOPS ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Get individual job results via GitHub API
        id: get_results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get workflow run details via GitHub API
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          API_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100"

          echo "Fetching job data from GitHub API..."
          echo "API URL: $API_URL"

          # Make API call with proper error handling
          HTTP_STATUS=$(curl -sSL -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" -o jobs.json)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "ERROR: GitHub API returned status $HTTP_STATUS"
            echo "Response content:"
            cat jobs.json
            exit 1
          fi

          # Validate JSON structure
          if ! jq empty jobs.json 2>/dev/null; then
            echo "ERROR: Invalid JSON response"
            echo "Response content:"
            cat jobs.json
            exit 1
          fi

          # Check if 'jobs' key exists
          if ! jq -e '.jobs' jobs.json > /dev/null; then
            echo "ERROR: Invalid GitHub API response. 'jobs' key not found."
            echo "Available keys:"
            jq 'keys' jobs.json 2>/dev/null || echo "Cannot determine keys"
            echo "Full response:"
            cat jobs.json
            exit 1
          fi

          # Verify we have jobs
          JOBS_COUNT=$(jq '.jobs | length' jobs.json)
          echo "Found $JOBS_COUNT jobs"

          if [ "$JOBS_COUNT" -eq 0 ]; then
            echo "WARNING: No jobs found. This might be normal for a fresh workflow run."
            # Set safe defaults
            echo "build_jobs_found=0" >> $GITHUB_OUTPUT
            echo "gitops_jobs_found=0" >> $GITHUB_OUTPUT
            echo "slack_color=warning" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== JOB LISTING ==="
          jq -r '.jobs[] | "- \(.name) (\(.conclusion // "running"))"' jobs.json

          echo "=== BUILD JOBS ==="
          BUILD_RESULTS=""
          while IFS= read -r line; do
            if [[ -n "$line" && "$line" != "null" ]]; then
              echo "Build job: $line"
              [[ -z "$BUILD_RESULTS" ]] && BUILD_RESULTS="$line" || BUILD_RESULTS="$BUILD_RESULTS,$line"
            fi
          done < <(jq -r '.jobs[] | select(.name | test("BUILD_AND_PUSH")) | "\(.name):\(.conclusion // "unknown")"' jobs.json)

          echo "=== GITOPS JOBS ==="
          GITOPS_RESULTS=""
          while IFS= read -r line; do
            if [[ -n "$line" && "$line" != "null" ]]; then
              echo "GitOps job: $line"
              [[ -z "$GITOPS_RESULTS" ]] && GITOPS_RESULTS="$line" || GITOPS_RESULTS="$GITOPS_RESULTS,$line"
            fi
          done < <(jq -r '.jobs[] | select(.name | test("UPDATE_GITOPS")) | "\(.name):\(.conclusion // "unknown")"' jobs.json)

          # Count jobs
          BUILD_JOBS_COUNT=$(jq '[.jobs[] | select(.name | test("BUILD_AND_PUSH"))] | length' jobs.json)
          GITOPS_JOBS_COUNT=$(jq '[.jobs[] | select(.name | test("UPDATE_GITOPS"))] | length' jobs.json)

          echo "build_jobs_found=$BUILD_JOBS_COUNT" >> $GITHUB_OUTPUT
          echo "gitops_jobs_found=$GITOPS_JOBS_COUNT" >> $GITHUB_OUTPUT

          # Determine overall success
          BUILD_FAILURES=$(jq '[.jobs[] | select(.name | test("BUILD_AND_PUSH")) | select(.conclusion != "success")] | length' jobs.json)
          GITOPS_FAILURES=$(jq '[.jobs[] | select(.name | test("UPDATE_GITOPS")) | select(.conclusion != "success")] | length' jobs.json)

          echo "Build failures: $BUILD_FAILURES"
          echo "GitOps failures: $GITOPS_FAILURES"

          if [[ "$BUILD_FAILURES" -eq 0 && "$GITOPS_FAILURES" -eq 0 ]]; then
            echo "slack_color=good" >> $GITHUB_OUTPUT
          else
            echo "slack_color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Generate detailed status report
        id: detailed_report
        run: |
          if [ ! -f "jobs.json" ]; then
            echo "ERROR: jobs.json not found"
            exit 1
          fi

          MESSAGE="Status:\n"

          # Build results grouped by region
          REGIONS="${{ needs.SETUP.outputs.regions }}"
          IFS=',' read -ra REGION_ARRAY <<< "$REGIONS"
          MESSAGE+="Build (image → ECR):\n"
          for region in "${REGION_ARRAY[@]}"; do
            BUILD_STATUS=$(jq -r --arg region "$region" '.jobs[]? | select(.name? // "" | test("BUILD_AND_PUSH.*" + $region)) | .conclusion // "pending"' jobs.json 2>/dev/null || echo "unknown")

            case "$BUILD_STATUS" in
              "success") BUILD_EMOJI="✅" ;;
              "failure") BUILD_EMOJI="❌" ;;
              "cancelled") BUILD_EMOJI="⚠️" ;;
              "pending"|"in_progress") BUILD_EMOJI="🔄" ;;
              *) BUILD_EMOJI="❓" ;;
            esac

            MESSAGE+="  $region: $BUILD_EMOJI $BUILD_STATUS\n"
          done

          # GitOps mirror results grouped by environment
          MESSAGE+="GitOps sync (olli-gitops → Argo CD):\n"
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            NAME="${entry%%:*}"
            STATUS="${entry#*:}"
            case "$STATUS" in
              "success") EMOJI="✅" ;;
              "failure") EMOJI="❌" ;;
              "cancelled") EMOJI="⚠️" ;;
              "pending"|"in_progress") EMOJI="🔄" ;;
              *) EMOJI="❓" ;;
            esac
            MESSAGE+="  $NAME: $EMOJI $STATUS\n"
          done < <(jq -r '.jobs[]? | select(.name? // "" | test("UPDATE_GITOPS")) | "\(.name):\(.conclusion // "pending")"' jobs.json 2>/dev/null)

          # Add summary line
          TOTAL_JOBS=$(jq '[.jobs[] | select(.name | test("BUILD_AND_PUSH|UPDATE_GITOPS"))] | length' jobs.json 2>/dev/null || echo "0")
          SUCCESS_JOBS=$(jq '[.jobs[] | select(.name | test("BUILD_AND_PUSH|UPDATE_GITOPS")) | select(.conclusion == "success")] | length' jobs.json 2>/dev/null || echo "0")

          MESSAGE+="\nSummary: $SUCCESS_JOBS/$TOTAL_JOBS jobs successful"

          # Use proper multiline output for GitHub Actions
          {
            echo 'message<<EOF'
            echo -e "$MESSAGE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Send notification
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: ${{ env.SLACK_CHANNEL }}
          SLACK_COLOR: ${{ steps.get_results.outputs.slack_color }}
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: ${{ steps.detailed_report.outputs.message }}
          SLACK_TITLE: 'Multi-Region GitOps Deploy - ${{ env.APP_NAME }}'
          SLACK_USERNAME: ${{ env.SLACK_USERNAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
