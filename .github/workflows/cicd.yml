on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      appName:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK:
        required: true
      TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  # Cluster configurations
  EKS_CLUSTER_US: buddyos
  EKS_CLUSTER_AP: eks-primary-prod-01  # Use same cluster name or change if different
  REGISTRY_US: 905418372464.dkr.ecr.us-east-1.amazonaws.com
  REGISTRY_AP: 905418372464.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE_NAME: ${{ inputs.imageName }}
  ENV_DEV: dev
  ENV_STG: stg
  ENV_PRE-PROD: uat
  ENV_PROD: prod
  # CD
  RELEASE_NAME: "chart-k8s"
  APP_NAME: ${{ inputs.appName }}
  NAMESPACE_DEV: "service-dev"
  NAMESPACE_STG: "service-staging"
  NAMESPACE_PRE-PROD: "service-uat"
  NAMESPACE_PROD: "service-production"

jobs:
  # DEV
  # Build and push to both regions
  build-and-push-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Tag Version
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Docker image
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Building Docker image with tag: $TAG"
          DOCKER_BUILDKIT=0 docker build -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      # Push to US-East-1 ECR
      - name: Push to US ECR Registry
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Pushing to US ECR Registry..."
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          
          # Create repository if it doesn't exist
          aws --region us-east-1 ecr describe-repositories \
          --repository-names ${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }} || \
          aws --region us-east-1 ecr create-repository \
          --repository-name ${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}
          
          # Tag and push to US registry
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_US }}/${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_US }}/${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Successfully pushed to US registry"

      # Push to AP-Southeast-1 ECR
      - name: Push to AP ECR Registry
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Pushing to AP ECR Registry..."
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          
          # Create repository if it doesn't exist
          aws --region ap-southeast-1 ecr describe-repositories \
          --repository-names ${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }} || \
          aws --region ap-southeast-1 ecr create-repository \
          --repository-name ${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}
          
          # Tag and push to AP registry
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_AP }}/${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_AP }}/${{ env.ENV_DEV }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Successfully pushed to AP registry"

  # Deploy to US-East-1 cluster with region-specific values
  deploy-us-east-1-dev:
    needs: build-and-push-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for US
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to US-East-1 EKS Cluster
        id: 'helm-us'
        env:
          TAG: ${{ needs.build-and-push.outputs.version }}
        run: |
          echo "Deploying to US-East-1 cluster with values-dev-us.yaml..."
          aws --region us-east-1 eks update-kubeconfig --region us-east-1 --name ${{ env.EKS_CLUSTER_US }}
          
          # Install Helm
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify values file exists
          if [ ! -f "values-dev-us.yaml" ]; then
            echo "Error: values-dev-us.yaml not found!"
            exit 1
          fi
          
          # Deploy with Helm using US-specific values
          helm pull oci://${{ env.REGISTRY_US }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_DEV }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_US }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-dev-us.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=us-east-1 \
            --atomic \
            --timeout 10m0s
          echo "Successfully deployed to US-East-1 with US-specific configuration"

      - name: Slack Notification - US Success
        if: ${{ success() }}
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: good
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: ':white_check_mark: Deployment completed successfully in US-East-1 with region-specific config'
          SLACK_TITLE: 'Deploy Success - US-East-1: ${{ env.APP_NAME }} v${{ needs.build-and-push.outputs.version }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notification - US Failed
        if: ${{ failure() }}
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: danger
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: ':x: Deployment failed in US-East-1. Check values-dev-us.yaml and configuration.'
          SLACK_TITLE: 'Deploy Failed - US-East-1: ${{ env.APP_NAME }} v${{ needs.build-and-push.outputs.version }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to AP-Southeast-1 cluster with region-specific values
  deploy-ap-southeast-1-dev:
    needs: build-and-push-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for AP
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AP-Southeast-1 EKS Cluster
        id: 'helm-ap'
        env:
          TAG: ${{ needs.build-and-push.outputs.version }}
        run: |
          echo "Deploying to AP-Southeast-1 cluster with values-dev-ap.yaml..."
          aws --region ap-southeast-1 eks update-kubeconfig --region ap-southeast-1 --name ${{ env.EKS_CLUSTER_AP }}
          
          # Install Helm
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify values file exists
          if [ ! -f "values-dev-ap.yaml" ]; then
            echo "Error: values-dev-ap.yaml not found!"
            exit 1
          fi
          
          # Deploy with Helm using AP-specific values
          helm pull oci://${{ env.REGISTRY_AP }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_DEV }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_AP }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-dev-ap.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=ap-southeast-1 \
            --atomic \
            --timeout 10m0s
          echo "Successfully deployed to AP-Southeast-1 with AP-specific configuration"

      - name: Slack Notification - AP Success
        if: ${{ success() }}
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: good
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: ':white_check_mark: Deployment completed successfully in AP-Southeast-1 with region-specific config'
          SLACK_TITLE: 'Deploy Success - AP-Southeast-1: ${{ env.APP_NAME }} v${{ needs.build-and-push.outputs.version }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notification - AP Failed
        if: ${{ failure() }}
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: danger
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: ':x: Deployment failed in AP-Southeast-1. Check values-dev-ap.yaml and configuration.'
          SLACK_TITLE: 'Deploy Failed - AP-Southeast-1: ${{ env.APP_NAME }} v${{ needs.build-and-push.outputs.version }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Final summary notification
#  deployment-summary:
#    needs: [build-and-push, deploy-us-east-1, deploy-ap-southeast-1]
#    runs-on: ubuntu-latest
#    if: always()
#    steps:
#      - name: Multi-Region Deployment Summary
#        uses: olli-ai/slack-notify-action-gke@master
#        env:
#          SLACK_CHANNEL: alert-services
#          SLACK_COLOR: ${{ (needs.deploy-us-east-1.result == 'success' && needs.deploy-ap-southeast-1.result == 'success') && 'good' || (needs.deploy-us-east-1.result == 'failure' || needs.deploy-ap-southeast-1.result == 'failure') && 'danger' || 'warning' }}
#          SLACK_LINK_NAMES: true
#          SLACK_MESSAGE: |
#            :globe_with_meridians: **Multi-Region Deployment Summary**
#
#            **Application:** ${{ env.APP_NAME }}
#            **Version:** ${{ needs.build-and-push.outputs.version }}
#            **Environment:** Development
#
#            **Regional Configuration:**
#            • US-East-1: values-dev-us.yaml
#            • AP-Southeast-1: values-dev-ap.yaml
#
#            **Deployment Results:**
#            • US-East-1: ${{ needs.deploy-us-east-1.result == 'success' && ':white_check_mark: Success' || needs.deploy-us-east-1.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
#            • AP-Southeast-1: ${{ needs.deploy-ap-southeast-1.result == 'success' && ':white_check_mark: Success' || needs.deploy-ap-southeast-1.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
#          SLACK_TITLE: 'Multi-Region Deployment Complete - ${{ env.APP_NAME }}'
#          SLACK_USERNAME: devops
#          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}


  # STAGING
  build-and-push-staging:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate Tag Version
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Docker image
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          echo "Building Docker image for staging with tag: $TAG"
          DOCKER_BUILDKIT=0 docker build -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push to US ECR Registry (Staging)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 ecr describe-repositories --repository-names ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }} || aws --region us-east-1 ecr create-repository --repository-name ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_US }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_US }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Push to AP ECR Registry (Staging)
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 ecr describe-repositories --repository-names ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }} || aws --region ap-southeast-1 ecr create-repository --repository-name ${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.REGISTRY_AP }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGISTRY_AP }}/${{ env.ENV_STG }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  deploy-us-east-1-staging:
    needs: build-and-push-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure AWS Credentials for US
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to US-East-1 EKS Cluster (Staging)
        env:
          TAG: ${{ needs.build-and-push-staging.outputs.version }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_US }}
          aws --region us-east-1 eks update-kubeconfig --region us-east-1 --name ${{ env.EKS_CLUSTER_US }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify staging values file exists
          if [ ! -f "values-staging-us.yaml" ]; then
            echo "Error: values-staging-us.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_US }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_STG }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_US }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-staging-us.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=us-east-1 \
            --atomic \
            --timeout 10m0s

  deploy-ap-southeast-1-staging:
    needs: build-and-push-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
