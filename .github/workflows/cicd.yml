          fi
          
          helm pull oci://${{ env.REGISTRY_US }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_PROD }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_US }}/helm-chart/all-service \
