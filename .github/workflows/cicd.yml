          aws-region: us-east-1

      - name: Deploy to US-East-1 EKS Cluster (Production)
        env:
          TAG: ${{ needs.build-and-push-production.outputs.version }}
        run: |
          aws --region us-east-1 eks update-kubeconfig --region us-east-1 --name ${{ env.EKS_CLUSTER_US }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify production values file exists
          if [ ! -f "values-production-us.yaml" ]; then
