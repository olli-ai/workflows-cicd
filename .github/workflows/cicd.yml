          submodules: true

      - name: Configure AWS Credentials for AP
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AP-Southeast-1 EKS Cluster (Staging)
        env:
          TAG: ${{ needs.build-and-push-staging.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ env.REGISTRY_AP }}
          aws --region ap-southeast-1 eks update-kubeconfig --region ap-southeast-1 --name ${{ env.EKS_CLUSTER_AP }}
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify staging values file exists
          if [ ! -f "values-staging-ap.yaml" ]; then
            echo "Error: values-staging-ap.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_AP }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_STG }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_AP }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-staging-ap.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=ap-southeast-1 \
            --atomic \
            --timeout 10m0s
          
    


  # Final summary notification
  deployment-summary-staging:
    needs: [build-and-push-staging, deploy-us-east-1-staging, deploy-ap-southeast-1-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Multi-Region Deployment Summary
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: ${{ (needs.deploy-us-east-1-staging.result == 'success' && needs.deploy-ap-southeast-1-staging.result == 'success') && 'good' || (needs.deploy-us-east-1-staging.result == 'failure' || needs.deploy-ap-southeast-1-staging.result == 'failure') && 'danger' || 'warning' }}
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: |
            - Regional Configuration:
            • US-East-1: values-staging-us.yaml
            • AP-Southeast-1: values-staging-ap.yaml

            - Deployment Results:
            • US-East-1: ${{ needs.deploy-us-east-1-staging.result == 'success' && ':white_check_mark: Success' || needs.deploy-us-east-1-staging.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
            • AP-Southeast-1: ${{ needs.deploy-ap-southeast-1-staging.result == 'success' && ':white_check_mark: Success' || needs.deploy-ap-southeast-1-staging.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
          SLACK_TITLE: 'Multi-Region Deployment Complete Staging - ${{ env.APP_NAME }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
