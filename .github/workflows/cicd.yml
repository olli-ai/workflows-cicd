          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          bash get_helm.sh
          
          # Verify production values file exists
          if [ ! -f "values-production-ap.yaml" ]; then
            echo "Error: values-production-ap.yaml not found!"
            exit 1
          fi
          
          helm pull oci://${{ env.REGISTRY_AP }}/helm-chart/all-service
          helm upgrade -n ${{ env.NAMESPACE_PROD }} ${{ env.APP_NAME }} oci://${{ env.REGISTRY_AP }}/helm-chart/all-service \
            --install \
            --wait \
            -f values-production-ap.yaml \
            --set tagImage=${{ env.TAG }} \
            --set region=ap-southeast-1 \
            --atomic \
            --timeout 10m0s

  # Final summary notification
  deployment-summary-production:
    needs: [build-and-push-production, deploy-us-east-1-production, deploy-ap-southeast-1-production]
    runs-on: ubuntu-latest
    steps:
      - name: Multi-Region Deployment Summary
        uses: olli-ai/slack-notify-action-gke@master
        env:
          SLACK_CHANNEL: alert-services
          SLACK_COLOR: ${{ (needs.deploy-us-east-1-production.result == 'success' && needs.deploy-ap-southeast-1-production.result == 'success') && 'good' || (needs.deploy-us-east-1-production.result == 'failure' || needs.deploy-ap-southeast-1-production.result == 'failure') && 'danger' || 'warning' }}
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: |
            - Regional Configuration:
            • US-East-1: values-production-us.yaml
            • AP-Southeast-1: values-production-ap.yaml

            - Deployment Results:
            • US-East-1: ${{ needs.deploy-us-east-1-production.result == 'success' && ':white_check_mark: Success' || needs.deploy-us-east-1-production.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
            • AP-Southeast-1: ${{ needs.deploy-ap-southeast-1-production.result == 'success' && ':white_check_mark: Success' || needs.deploy-ap-southeast-1-production.result == 'failure' && ':x: Failed' || ':warning: Skipped' }}
          SLACK_TITLE: 'Multi-Region Deployment Complete Production - ${{ env.APP_NAME }}'
          SLACK_USERNAME: devops
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}